<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Medicines Modal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-gray-800 min-h-screen flex items-center justify-center p-4">

  <!-- Main Modal Overlay Container -->
  <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    
    <!-- Modal Card -->
    <div class="bg-white rounded-xl max-w-5xl w-full overflow-hidden flex flex-col shadow-2xl relative" style="max-height: 88vh;">
      
      <!-- Header -->
      <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between" style="background-color: rgb(78, 93, 181);">
        <div>
          <h3 class="text-white font-semibold text-base">Manage Medicines</h3>
          <p class="text-xs text-white text-opacity-80 mt-0.5"><span id="medicine-count">250</span> medicines in your clinic list</p>
        </div>
        <button id="close-modal-btn" onclick="alert('Main modal closed')" class="text-white hover:bg-white hover:bg-opacity-20 rounded-lg p-1.5 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
        </button>
      </div>

      <!-- Controls & Toolbar -->
      <div class="px-6 py-3 border-b border-gray-100 flex items-center gap-3 flex-wrap">
        <div class="relative flex-1 min-w-[200px]">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg>
          <input id="search-input" type="text" placeholder="Search medicines..." class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" value="">
        </div>
        <select id="status-filter" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none bg-white cursor-pointer">
          <option value="all">All medicines</option>
          <option value="active" selected>Active only</option>
          <option value="inactive">Inactive only</option>
        </select>
        <button id="import-btn" onclick="openImportPopup()" class="flex items-center gap-1.5 px-3 py-2 border border-indigo-200 rounded-lg text-xs font-semibold hover:bg-indigo-50 transition-colors" style="color: rgb(78, 93, 181);">Import Excel/CSV</button>
        <button id="add-medicine-btn" onclick="toggleInlineForm()" class="flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-semibold text-white transition-colors hover:opacity-90" style="background-color: rgb(78, 93, 181);">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg> Cancel
        </button>
      </div>

      <!-- Medicine List & Inline Form Container -->
      <div class="flex-1 overflow-y-auto px-6 py-3" style="min-height: 380px;">
        
        <!-- INLINE ADD / EDIT MEDICINE PANEL (Dropdown design as per screenshot) -->
        <div id="inlineMedForm" class="mb-4 p-4 border-2 border-indigo-200 rounded-xl bg-indigo-50/30">
          <p id="inlineFormTitle" class="text-xs font-semibold mb-3" style="color: rgb(78, 93, 181);">Add New Medicine</p>
          <form id="medForm" onsubmit="saveMedicine(event)">
            <input type="hidden" id="editMedId" value="-1">
            <div class="grid grid-cols-1 md:grid-cols-7 gap-2.5 items-center">
              
              <div class="md:col-span-1">
                <input id="inputMedName" required placeholder="Medicine Name *" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
              </div>

              <div class="md:col-span-1">
                <input id="inputMedDose" placeholder="Strength" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
              </div>

              <div class="md:col-span-1">
                <select id="inputMedType" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs bg-white outline-none text-gray-700">
                  <option value="" disabled selected>Form</option>
                  <option value="Soap">Soap</option>
                  <option value="Tablet">Tablet</option>
                  <option value="Capsule">Capsule</option>
                  <option value="Syrup">Syrup</option>
                  <option value="Injection">Injection</option>
                  <option value="—">—</option>
                </select>
              </div>

              <div class="md:col-span-1">
                <input id="inputGenericName" placeholder="Generic Name" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
              </div>

              <div class="md:col-span-1">
                <input id="inputBrandName" placeholder="Brand Name" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
              </div>

              <div class="md:col-span-1">
                <select id="inputCategory" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs bg-white outline-none text-gray-700">
                  <option value="" disabled selected>Category</option>
                  <option value="Antibiotic">Antibiotic</option>
                  <option value="Analgesic">Analgesic</option>
                  <option value="Cardiovascular">Cardiovascular</option>
                  <option value="General">General</option>
                </select>
              </div>

              <div class="md:col-span-1 flex items-center gap-1.5 justify-end">
                <button type="button" onclick="hideInlineForm()" class="px-3 py-2 rounded-lg text-xs font-medium text-gray-700 border border-gray-300 bg-white hover:bg-gray-50 transition-colors w-full md:w-auto">Cancel</button>
                <button type="submit" id="saveBtnText" class="px-4 py-2 rounded-lg text-white text-xs font-semibold transition-all hover:opacity-90 w-full md:w-auto" style="background-color: rgb(78, 93, 181);">Add</button>
              </div>

            </div>
          </form>
        </div>

        <div id="medicine-list" class="space-y-2">
          <!-- Dynamic Medicine Rows Render Here -->
        </div>
      </div>

      <!-- Footer Pagination -->
      <div class="px-6 py-3 border-t border-gray-100 flex items-center justify-between">
        <p class="text-xs text-gray-500" id="pagination-info">Page 1 of 17</p>
        <div class="flex gap-2">
          <button id="prev-btn" disabled class="px-3 py-1.5 border border-gray-300 rounded-lg text-xs font-medium disabled:opacity-40 disabled:cursor-not-allowed hover:bg-gray-50 transition-colors">← Prev</button>
          <button id="next-btn" class="px-3 py-1.5 border border-gray-300 rounded-lg text-xs font-medium disabled:opacity-40 disabled:cursor-not-allowed hover:bg-gray-50 transition-colors">Next →</button>
        </div>
      </div>

      <!-- IMPORT EXCEL / CSV OVERLAY POPUP -->
      <div id="importOverlay" class="absolute inset-0 bg-black/40 backdrop-blur-[1px] flex items-center justify-center p-4 z-20 hidden">
        <div class="bg-white rounded-xl max-w-md w-full overflow-hidden shadow-2xl border border-gray-100">
          <div class="px-6 py-3.5 flex items-center justify-between border-b border-gray-200" style="background-color: rgb(78, 93, 181);">
            <h4 class="text-white font-semibold text-sm">Import Excel / CSV</h4>
            <button type="button" onclick="closeImportPopup()" class="text-white hover:opacity-75 text-lg font-bold">&times;</button>
          </div>
          <div class="p-5">
            <div class="rounded-lg p-3.5 mb-4" style="background: rgb(238, 240, 251);">
              <p class="text-xs font-semibold mb-1" style="color: rgb(78, 93, 181);">Step 1 — Download Template</p>
              <p class="text-xs text-gray-600 mb-2.5">Fill in your medicine list and upload it below.</p>
              <button type="button" onclick="alert('Downloading template...')" class="px-3 py-1.5 bg-white border border-indigo-200 rounded-lg text-xs font-semibold text-indigo-700 hover:bg-indigo-50 transition-colors">Download Template</button>
            </div>
            
            <p class="text-xs font-semibold mb-1.5" style="color: rgb(78, 93, 181);">Step 2 — Select File</p>
            <div onclick="document.getElementById('fileInput').click()" class="border-2 border-dashed border-gray-300 rounded-lg p-5 text-center cursor-pointer hover:border-indigo-400 bg-gray-50 transition-colors">
              <input id="fileInput" type="file" accept=".csv,.xlsx,.xls" class="hidden" onchange="handleFileChange(event)">
              <p id="fileNameText" class="text-xs font-medium text-gray-700">Click to choose a file</p>
              <p class="text-[11px] text-gray-400 mt-1">.csv or .xlsx</p>
            </div>

            <div class="pt-4 mt-4 border-t border-gray-100 flex justify-end gap-2">
              <button type="button" onclick="closeImportPopup()" class="px-4 py-2 rounded-lg text-xs font-medium text-gray-700 border border-gray-300 hover:bg-gray-50 transition-colors">Cancel</button>
              <button id="importSubmitBtn" disabled onclick="executeImport()" class="px-4 py-2 rounded-lg text-white text-xs font-semibold transition-all disabled:opacity-50" style="background-color: rgb(78, 93, 181);">Upload & Import</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Interactive JavaScript Logic -->
  <script>
    const initialMedicines = [
      { id: 1, name: "Aclix 75gm", dose: "75gm", type: "Soap", generic: "", brand: "", category: "", status: "Active" },
      { id: 2, name: "Aclix LB", dose: "", type: "Capsule", generic: "", brand: "", category: "", status: "Active" },
      { id: 3, name: "Amisulpiride", dose: "100mg", type: "—", generic: "", brand: "", category: "", status: "Active" },
      { id: 4, name: "Amlodipine", dose: "10mg", type: "—", generic: "", brand: "", category: "", status: "Active" },
      { id: 5, name: "Amlodipine", dose: "2.5mg", type: "—", generic: "", brand: "", category: "", status: "Active" },
      { id: 6, name: "Amlodipine", dose: "5mg", type: "—", generic: "", brand: "", category: "", status: "Active" },
      { id: 7, name: "Amoxicillin", dose: "250mg", type: "—", generic: "", brand: "", category: "", status: "Active" },
      { id: 8, name: "Amoxicillin", dose: "875mg", type: "—", generic: "", brand: "", category: "", status: "Active" },
      { id: 9, name: "Amoxicillin", dose: "500mg", type: "—", generic: "", brand: "", category: "", status: "Active" },
      { id: 10, name: "Amro CV 625", dose: "", type: "—", generic: "", brand: "", category: "", status: "Active" },
      { id: 11, name: "Apiyest Forte", dose: "", type: "Capsule", generic: "", brand: "", category: "", status: "Active" },
      { id: 12, name: "Aripiprazole", dose: "5mg", type: "—", generic: "", brand: "", category: "", status: "Active" },
      { id: 13, name: "Ascoforte CZ", dose: "", type: "Tablet", generic: "", brand: "", category: "", status: "Active" },
      { id: 14, name: "Aspirin", dose: "325mg", type: "—", generic: "", brand: "", category: "", status: "Active" },
      { id: 15, name: "Aspirin", dose: "75mg", type: "—", generic: "", brand: "", category: "", status: "Active" },
      { id: 16, name: "Atorvastatin", dose: "20mg", type: "Tablet", generic: "", brand: "", category: "", status: "Inactive" },
      { id: 17, name: "Azithromycin", dose: "500mg", type: "Tablet", generic: "", brand: "", category: "", status: "Active" },
      { id: 18, name: "Cetirizine", dose: "10mg", type: "Tablet", generic: "", brand: "", category: "", status: "Inactive" }
    ];

    let medicines = [...initialMedicines];
    let currentPage = 1;
    const itemsPerPage = 15;

    const listContainer = document.getElementById("medicine-list");
    const searchInput = document.getElementById("search-input");
    const statusFilter = document.getElementById("status-filter");
    const countDisplay = document.getElementById("medicine-count");
    const paginationInfo = document.getElementById("pagination-info");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const inlineMedForm = document.getElementById("inlineMedForm");
    const addMedicineBtn = document.getElementById("add-medicine-btn");

    function renderList() {
      const searchTerm = searchInput.value.toLowerCase().trim();
      const selectedStatus = statusFilter.value;

      const filtered = medicines.filter(item => {
        const matchesSearch = item.name.toLowerCase().includes(searchTerm) || (item.dose && item.dose.toLowerCase().includes(searchTerm)) || (item.type && item.type.toLowerCase().includes(searchTerm));
        const matchesStatus = selectedStatus === "all" ? true : item.status.toLowerCase() === selectedStatus;
        return matchesSearch && matchesStatus;
      });

      countDisplay.textContent = medicines.length;

      const totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
      if (currentPage > totalPages) currentPage = totalPages;

      const startIndex = (currentPage - 1) * itemsPerPage;
      const paginatedItems = filtered.slice(startIndex, startIndex + itemsPerPage);

      paginationInfo.textContent = `Page ${currentPage} of ${totalPages}`;
      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === totalPages || totalPages === 0;

      if (paginatedItems.length === 0) {
        listContainer.innerHTML = `<div class="py-12 text-center text-gray-500 text-sm">No medicines found.</div>`;
        return;
      }

      listContainer.innerHTML = paginatedItems.map(item => {
        const isActive = item.status === "Active";
        const badgeBg = isActive ? "rgb(220, 252, 231)" : "rgb(254, 226, 226)";
        const badgeColor = isActive ? "rgb(21, 128, 61)" : "rgb(185, 28, 28)";

        return `
          <div class="flex items-center justify-between gap-3 p-3 border border-gray-200 rounded-lg hover:border-indigo-100 transition-colors bg-white">
            <div class="min-w-0 flex-1">
              <p class="text-sm font-semibold text-gray-900 truncate">${item.name}</p>
              <p class="text-xs text-gray-500 mt-0.5 truncate">${item.type || '—'}</p>
            </div>
            <span class="text-xs font-semibold px-2.5 py-1 rounded-full flex-shrink-0" style="background-color: ${badgeBg}; color: ${badgeColor};">${item.status}</span>
            <div class="flex items-center gap-1.5 flex-shrink-0">
              <button onclick="editMedicine(${item.id})" class="p-1.5 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors text-indigo-600" title="Edit">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pencil"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg>
              </button>
              <button onclick="toggleStatus(${item.id})" class="p-1.5 border border-red-200 text-red-500 rounded-lg hover:bg-red-50 transition-colors" title="Deactivate/Delete">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleStatus(id) {
      medicines = medicines.map(m => m.id === id ? { ...m, status: m.status === "Active" ? "Inactive" : "Active" } : m);
      renderList();
    }

    /* Inline Form Toggle & Controls */
    function toggleInlineForm() {
      if (inlineMedForm.classList.contains("hidden")) {
        openAddInlineForm();
      } else {
        hideInlineForm();
      }
    }

    function openAddInlineForm() {
      document.getElementById("inlineFormTitle").innerText = "Add New Medicine";
      document.getElementById("editMedId").value = "-1";
      document.getElementById("inputMedName").value = "";
      document.getElementById("inputMedDose").value = "";
      document.getElementById("inputMedType").value = "";
      document.getElementById("inputGenericName").value = "";
      document.getElementById("inputBrandName").value = "";
      document.getElementById("inputCategory").value = "";
      document.getElementById("saveBtnText").innerText = "Add";
      
      inlineMedForm.classList.remove("hidden");
      updateAddButtonState(true);
      inlineMedForm.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function editMedicine(id) {
      const med = medicines.find(m => m.id === id);
      if (med) {
        document.getElementById("inlineFormTitle").innerText = "Edit Medicine";
        document.getElementById("editMedId").value = id;
        document.getElementById("inputMedName").value = med.name || "";
        document.getElementById("inputMedDose").value = med.dose || "";
        document.getElementById("inputMedType").value = med.type || "";
        document.getElementById("inputGenericName").value = med.generic || "";
        document.getElementById("inputBrandName").value = med.brand || "";
        document.getElementById("inputCategory").value = med.category || "";
        document.getElementById("saveBtnText").innerText = "Save";

        inlineMedForm.classList.remove("hidden");
        updateAddButtonState(true);
        inlineMedForm.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function hideInlineForm() {
      inlineMedForm.classList.add("hidden");
      updateAddButtonState(false);
    }

    function updateAddButtonState(isOpen) {
      if (isOpen) {
        addMedicineBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg> Cancel`;
        addMedicineBtn.style.backgroundColor = "rgb(78, 93, 181)";
        addMedicineBtn.onclick = hideInlineForm;
      } else {
        addMedicineBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg> Add Medicine`;
        addMedicineBtn.style.backgroundColor = "rgb(78, 93, 181)";
        addMedicineBtn.onclick = openAddInlineForm;
      }
    }

    function saveMedicine(e) {
      e.preventDefault();
      const id = parseInt(document.getElementById("editMedId").value);
      const name = document.getElementById("inputMedName").value;
      const dose = document.getElementById("inputMedDose").value;
      const type = document.getElementById("inputMedType").value;
      const generic = document.getElementById("inputGenericName").value;
      const brand = document.getElementById("inputBrandName").value;
      const category = document.getElementById("inputCategory").value;

      if (id > 0) {
        medicines = medicines.map(m => m.id === id ? { ...m, name, dose, type, generic, brand, category } : m);
      } else {
        medicines.unshift({
          id: Date.now(),
          name,
          dose: dose || "",
          type: type || "—",
          generic: generic || "",
          brand: brand || "",
          category: category || "",
          status: "Active"
        });
      }

      renderList();
      hideInlineForm();
    }

    /* Popup Import Controls */
    function openImportPopup() {
      document.getElementById("importOverlay").classList.remove("hidden");
    }

    function closeImportPopup() {
      document.getElementById("importOverlay").classList.add("hidden");
      document.getElementById("fileInput").value = "";
      document.getElementById("fileNameText").innerText = "Click to choose a file";
      document.getElementById("importSubmitBtn").disabled = true;
    }

    function handleFileChange(e) {
      const file = e.target.files[0];
      if (file) {
        document.getElementById("fileNameText").innerText = file.name;
        document.getElementById("importSubmitBtn").disabled = false;
      }
    }

    function executeImport() {
      alert("File successfully imported!");
      closeImportPopup();
    }

    searchInput.addEventListener("input", () => { currentPage = 1; renderList(); });
    statusFilter.addEventListener("change", () => { currentPage = 1; renderList(); });

    prevBtn.addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage--;
        renderList();
      }
    });

    nextBtn.addEventListener("click", () => {
      currentPage++;
      renderList();
    });

    renderList();
  </script>
</body>
</html>
